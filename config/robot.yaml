    command_joint_names: [lbr_A1, lbr_A2, lbr_A3, lbr_A4, lbr_A5, lbr_A6, lbr_A7]
    home_positions_rad: [0.0, 0.35, 0.0, -1.3, 0.0, 1.0, 0.0]
    source:
      repository: pybullet_data

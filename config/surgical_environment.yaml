# =====================================================================
# CONFIGURAZIONE AMBIENTE CHIRURGICO ROBOTIZZATO (KUKA LBR IIWA)
# =====================================================================
# Questo file centralizza la geometria della sala operatoria, la posizione
# degli elementi fisici (tavolo, vassoi, chirurgo, base robot), la calibrazione
# ottica, i parametri di moto cinematico e le tolleranze di controllo.
# =====================================================================

environment:
  room:
    description: "Blocco Operatorio Robotizzato"
    dimensions_xyz_m: [4.0, 4.0, 2.8]

  kuka_base:
    description: "Base fissa del manipolatore KUKA LBR iiwa"
    frame_id: "lbr_link_0"
    position_xyz_m: [0.0, 0.0, 0.0]
    orientation_rpy_rad: [0.0, 0.0, 0.0]

  surgical_table:
    description: "Tavolo operatorio principale"
    center_xyz_m: [0.60, 0.0, -0.05]
    dimensions_xyz_m: [0.85, 1.60, 0.20]
    surface_z_m: 0.05
    color_rgba: [0.15, 0.35, 0.60, 1.0] # Blu campo sterile ospedaliero

  trays:
    tray_1:
      name: "Vassoio Raccolta e Decontaminazione Destro"
      alias: ["tray_1", "vassoio_1", "tray 1", "right tray"]
      position_xyz_m: [0.60, 0.42, 0.07]
      dimensions_xyz_m: [0.62, 0.68, 0.04]
      color_rgba: [0.80, 0.82, 0.85, 1.0] # Acciaio inox opaco
    tray_2:
      name: "Vassoio Strumenti Sterili Sinistro"
      alias: ["tray_2", "vassoio_2", "tray 2", "left tray"]
      position_xyz_m: [0.60, -0.42, 0.07]
      dimensions_xyz_m: [0.62, 0.68, 0.04]
      color_rgba: [0.80, 0.82, 0.85, 1.0] # Acciaio inox opaco

  surgeon:
    description: "Postazione Chirurgo / Operatore sterile (campo opposto)"
    position_xyz_m: [1.10, 0.0, 0.0]
    safety_clearance_radius_m: 0.40

# ---------------------------------------------------------------------
# Calibrazione Sensore Ottico (Telecamera RGB-D Overhead)
# ---------------------------------------------------------------------
camera_overhead:
  auto_track_source_tray: true # Se true, la telecamera centra automaticamente la linea di vista sopra il vassoio di origine
  height_above_tray_m: 1.08    # Quota verticale (Z) sopra il vassoio quando auto_track_source_tray è attivo
  extrinsics:
    position_robot_frame_xyz_m: [0.60, -0.42, 1.15] # Usato come posa fissa se auto_track_source_tray: false
    target_position_xyz_m: [0.60, -0.42, 0.07]
    orientation_view: "nadir_top_down"
  intrinsics:
    fx_px: 615.0
    fy_px: 615.0
    cx_px: 320.0 # Se omesso, calcolato automaticamente come width_px / 2.0
    cy_px: 240.0 # Se omesso, calcolato automaticamente come height_px / 2.0
  width_px: 640
  height_px: 480
  publish_hz: 10.0
  depth_format: "32FC1" # Profondità metrica float32 in metri

# ---------------------------------------------------------------------
# Riferimento Strumento Chirurgico STL & Presa Fisica
# ---------------------------------------------------------------------
surgical_instrument:
  description: "Riferimento STL strumento chirurgico per stima grasp e simulazione fisica"
  stl_path: "auto" # Auto-discovery dinamico delle mesh presenti in data/inputs
  mesh_scale: [1.0, 1.0, 1.0] # L'auto-scaling intelligente gestisce automaticamente mm o metri
  mass_kg: 0.080
  initial_position_xyz_m: [0.60, -0.42, 0.095]
  initial_orientation_rpy_deg: [0.0, 0.0, 0.0]
  gripper_topic: "/lbr/gripper/command"

# ---------------------------------------------------------------------
# Parametri di Rendering e Registrazione Video HD Presentazione
# ---------------------------------------------------------------------
video_rendering:
  mode: "offline_post_processing" # Disaccoppiato dal real-time (zero impatto sui controller ROS 2)
  resolution:
    width_px: 1280
    height_px: 720 # Formato 16:9 HD widescreen pulito e cinematografico
  framerate_hz: 30.0
  camera_view:
    target_xyz_m: [0.45, 0.0, 0.25]
    distance_m: 1.35
    yaw_deg: 48.0
    pitch_deg: -28.0
  output_filename: "medical_pick_and_place.mp4"

# ---------------------------------------------------------------------
# Parametri di Controllo del Moto (ROS 2 Control & Cinematica Cartesiana)
# ---------------------------------------------------------------------
motion_control:
  velocities:
    cartesian_linear_speed_m_s: 0.16
    cartesian_angular_speed_rad_s: 0.80
    joint_speed_rad_s: 1.00
  heights_z_m:
    staging_z: 0.45      # Standby e transizione
    approach_z: 0.32     # Quota discesa sopra lo strumento
    lift_clearance_z: 0.35 # Quota sollevamento e trasporto
  downward_quaternion_xyzw: [0.0, 1.0, 0.0, 0.0]
  tolerances:
    goal_time_s: 0.0
    goal_joint_tolerance_rad: 0.0
    stopped_velocity_tolerance_rad_s: 0.0
  timeouts:
    step_timeout_sec: 30.0
    bringup_wait_sec: 25.0

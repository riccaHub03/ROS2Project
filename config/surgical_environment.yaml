# =====================================================================
# CONFIGURAZIONE AMBIENTE CHIRURGICO ROBOTIZZATO (KUKA LBR IIWA)
# =====================================================================
# Questo file centralizza la geometria della sala operatoria, la posizione
# degli elementi fisici (tavolo, vassoi, chirurgo, base robot), la calibrazione
# ottica, i parametri di moto cinematico e le tolleranze di controllo.
# =====================================================================

environment:
  # Tavolo, vassoi e posa della base sono espressi nel riferimento fisso world.
  room:
    description: "Blocco Operatorio Robotizzato"
    dimensions_xyz_m: [4.0, 4.0, 2.8]

  kuka_base:
    description: "Base fissa del manipolatore KUKA LBR iiwa"
    frame_id: "lbr_link_0"
    position_xyz_m: [0.0, 0.0, 0.0] # X, Y, Z nel mondo, in metri
    orientation_rpy_rad: [0.0, 0.0, 0.0] # Roll, pitch, yaw nel mondo, in radianti

  surgical_table:
    description: "Tavolo operatorio principale"
    center_xyz_m: [0.60, 0.0, -0.05]
    dimensions_xyz_m: [0.85, 1.60, 0.20]
    surface_z_m: 0.05
    color_rgba: [0.15, 0.35, 0.60, 1.0] # Blu campo sterile ospedaliero

  trays:
    tray_1:
      name: "Vassoio Raccolta e Decontaminazione Destro"
      alias: ["tray_1", "vassoio_1", "tray 1", "right tray"]
      position_xyz_m: [0.60, 0.42, 0.07]
      dimensions_xyz_m: [0.62, 0.68, 0.04]
      color_rgba: [0.80, 0.82, 0.85, 1.0] # Acciaio inox opaco
    tray_2:
      name: "Vassoio Strumenti Sterili Sinistro"
      alias: ["tray_2", "vassoio_2", "tray 2", "left tray"]
      position_xyz_m: [0.60, -0.42, 0.07]
      dimensions_xyz_m: [0.62, 0.68, 0.04]
      color_rgba: [0.80, 0.82, 0.85, 1.0] # Acciaio inox opaco

  surgeon:
    description: "Postazione Chirurgo / Operatore sterile (campo opposto)"
    position_xyz_m: [1.10, 0.0, 0.0]
    safety_clearance_radius_m: 0.40

# ---------------------------------------------------------------------
# Calibrazione Sensore Ottico (Telecamera RGB-D Overhead)
# ---------------------------------------------------------------------
camera_overhead:
  auto_track_source_tray: true # Se true, la telecamera centra automaticamente la linea di vista sopra il vassoio di origine
  height_above_tray_m: 1.08    # Quota verticale (Z) sopra il vassoio quando auto_track_source_tray è attivo
  extrinsics:
    position_world_frame_xyz_m: [0.60, -0.42, 1.15] # Posa fissa nel mondo se auto_track_source_tray: false
    target_position_xyz_m: [0.60, -0.42, 0.07]
    verified: false # true SOLO dopo la calibrazione mano-occhio misurata: senza, la presa reale non e' abilitata al movimento
    orientation_view: "nadir_top_down"
  intrinsics:
    fx_px: 615.0
    fy_px: 615.0
    cx_px: 320.0 # Se omesso, calcolato automaticamente come width_px / 2.0
    cy_px: 240.0 # Se omesso, calcolato automaticamente come height_px / 2.0
  width_px: 640
  height_px: 480
  publish_hz: 10.0
  depth_format: "32FC1" # Profondità metrica float32 in metri
  # Sorgente dal vivo della pipeline reale (--source ros2): topic della camera e frame TF. Le opzioni da riga di
  # comando (--color-topic, --world-frame, ...) hanno la precedenza. Valori sotto = default del codice.
  ros2:
    color_topic: /camera/color/image_raw
    depth_topic: /camera/aligned_depth_to_color/image_raw   # profondita' ALLINEATA al colore (16UC1 mm o 32FC1 m)
    camera_info_topic: /camera/color/camera_info
    world_frame: world        # se la TF non ha 'world' usare il frame della base e tenere kuka_base = posa identita'
    camera_frame: null        # null = frame_id di CameraInfo (deve essere il frame OTTICO)
    ee_frame: null            # es. lbr_link_ee: la posa dell'end-effector viene letta dalla TF alla cattura
    timeout_s: 10.0
    depth_frames: 5           # mediana su piu' fotogrammi di profondita'
    max_sync_s: 0.2
    tf_timeout_s: 3.0

# ---------------------------------------------------------------------
# Riferimento Strumento Chirurgico STL & Presa Fisica
# ---------------------------------------------------------------------
surgical_instrument:
  description: "Riferimento STL strumento chirurgico per stima grasp e simulazione fisica"
  stl_path: "auto" # Auto-discovery dinamico delle mesh presenti in data/inputs
  mesh_scale: [1.0, 1.0, 1.0] # L'auto-scaling intelligente gestisce automaticamente mm o metri
  mass_kg: 0.080
  initial_position_xyz_m: [0.60, -0.42, 0.095]
  initial_orientation_rpy_deg: [0.0, 0.0, 0.0]
  gripper_topic: "/lbr/gripper/command"

# ---------------------------------------------------------------------
# Parametri di Rendering e Registrazione Video HD Presentazione
# ---------------------------------------------------------------------
video_rendering:
  mode: "offline_post_processing" # Disaccoppiato dal real-time (zero impatto sui controller ROS 2)
  resolution:
    width_px: 1280
    height_px: 720 # Formato 16:9 HD widescreen pulito e cinematografico
  framerate_hz: 30.0
  camera_view:
    target_xyz_m: [0.45, 0.0, 0.25]
    distance_m: 1.35
    yaw_deg: 48.0
    pitch_deg: -28.0
  output_filename: "medical_pick_and_place.mp4"

# ---------------------------------------------------------------------
# Validazione delle prese (stadio grasp): candidati e fattibilita' nel modello della cella
# ---------------------------------------------------------------------
# Ogni candidato (posizione, orientamento, apertura, approccio) percorre lo stesso percorso dell'anteprima
# (avvicinamento, discesa, sollevamento, trasferimento, deposito) in un modello PyBullet del KUKA, di tavolo e vassoi:
# IK, limiti dei giunti e collisioni di braccio, pinza e strumento trasportato. E' un pre-filtro cinematico, non
# sostituisce MoveIt: vedi "limitations" in grasp.json. Parametri non elencati: default in pipeline/feasibility.py.
grasp_validation:
  enabled: true                 # false: solo candidati geometrici, nessuna verifica IK/collisioni
  require_feasibility: true     # senza un candidato fattibile la presa e' NOT_READY_FOR_ROBOT_MOTION
  positions_along_zone: 5       # candidati lungo la zona di presa (35-65% della lunghezza dello strumento)
  both_jaw_orientations: true   # anche con le ganasce invertite di 180 gradi: cambia la soluzione IK
  pinch_target_m: 0.006         # quanto sotto la superficie dello strumento arrivano le punte delle dita
  collision_margin_m: 0.010     # distanza minima da tavolo, vassoi e tra i link del braccio
  min_joint_margin_rad: 0.03    # distanza minima da ogni limite di giunto
  robot_urdf: null              # usa config/robot.yaml; un override diverso viene rifiutato

# ---------------------------------------------------------------------
# Parametri di Controllo del Moto (ROS 2 Control & Cinematica Cartesiana)
# ---------------------------------------------------------------------
motion_control:
  # Velocita' nominali del TCP: fonte unica per l'anteprima PyBullet e per l'IK differenziale.
  velocities:
    cartesian_linear_speed_m_s: 0.12
    cartesian_angular_speed_rad_s: 0.80
  # IK differenziale (damped least squares) con vincoli di velocita', accelerazione e jerk dei giunti
  # (pipeline/sim/constrained_differential_ik.py). I limiti sono bound del passo di controllo, non una verifica a
  # posteriori. enabled: false => IK PyBullet con interpolazione lineare, nessun vincolo e nessun grafico.
  differential_ik:
    enabled: false
    # null = limiti dell'URDF condiviso; un valore esplicito puo' solo restringerli.
    joint_max_velocity_rad_s: null
    velocity_safety_factor: 0.6        # si pianifica al 60% del limite hardware
    # Accelerazione e jerk NON sono dati del costruttore: segnaposto prudenti, da TARARE sul robot reale.
    joint_max_acceleration_rad_s2: 4.0
    joint_max_jerk_rad_s3: 40.0
    position_margin_rad: 0.05          # distanza di sicurezza dai limiti di posizione (con frenata anticipata)
    damping: {max: 0.05, singularity_threshold: 0.05}   # smorzamento DLS, cresce solo vicino alle singolarita'
    nullspace_gain: 1.0                # richiamo verso la postura di partenza (evita cambi di ramo)
    feedback_gain: 5.0                 # guadagno P dell'errore cartesiano [1/s]
    plot: true                         # sim_robot_joint_velocities.png e sim_robot_joint_acc_jerk.png
  heights_z_m:
    staging_z: 0.45      # Standby e transizione
    approach_z: 0.32     # Quota discesa sopra lo strumento
    lift_clearance_z: 0.35 # Quota sollevamento e trasporto
  downward_quaternion_xyzw: [0.0, 1.0, 0.0, 0.0]
  # Zona raggiungibile dal TCP con pinza verso il basso (corona attorno alla base, in m).
  # Valori misurati con scansione IK sul modello PyBullet: RIMISURARE con URDF, montaggio e pinza reali.
  workspace:
    reach_r_min_m: 0.41   # raggio minimo, vale solo sotto low_z_m
    reach_r_max_m: 0.78
    low_z_m: 0.15
  # Posa dell'end-effector, espressa nel riferimento world, usata per esprimere i punti nel frame EE.
  # SUL ROBOT REALE sostituire con la TF world -> flangia/TCP letta all'acquisizione; senza, il frame EE
  # e' nominale e la presa reale viene segnata NOT_READY_FOR_ROBOT_MOTION.
  # ee_reference_pose:
  #   position_xyz_m: [0.45, 0.0, 0.45]
  #   quaternion_xyzw: [0.0, 1.0, 0.0, 0.0]
  # Tempi del nodo ROS 2 surgical_executor (ros2/surgical_executor).
  timeouts:
    step_timeout_sec: 30.0      # esecuzione di una sequenza di waypoint
    bringup_wait_sec: 25.0      # attesa della piattaforma robotica
    accept_timeout_sec: 10.0    # attesa dell'accettazione della traiettoria
    gripper_settle_sec: 0.8     # pausa dopo il comando alla pinza
